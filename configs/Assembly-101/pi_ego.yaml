TRAIN:
  ENABLE: True
  DATASET: Assembly101_proxy
  BATCH_SIZE: 8
  EVAL_PERIOD: 5
  CHECKPOINT_PERIOD: 5
  AUTO_RESUME: True
DATA:
  PATH_TO_DATA_DIR: '/home/wchi/Datasets/Assembly101/fine-grained-segments/Ego'
  PATH_PREFIX: '/home/wchi/Datasets/Assembly101/fine-grained-segments'
  SKL_MODEL_BY_FEATS: '/home/wchi/Datasets/Assembly101/distillation/exo_skl'
  RGB_MODEL_BY_FEATS: '/home/wchi/Datasets/Assembly101/distillation/exo_rgb'
  EXO_SIGLIP_BY_FEATS: '/home/wchi/Datasets/Assembly101/distillation/exo_siglip'
  EGO_SIGLIP_BY_FEATS: '/home/wchi/Datasets/Assembly101/distillation/ego_siglip'
  EXO_SKEGO_BY_FEATS: '/home/wchi/Datasets/Assembly101/distillation/exo_skego'
  EGO_DEPTH_BY_FEATS: '/home/wchi/Datasets/Assembly101/distillation/ego_depth'
  EXO_DEPTH_BY_FEATS: '/home/wchi/Datasets/Assembly101/distillation/exo_depth'
  EGO_DINO_BY_FEATS: '/home/wchi/Datasets/Assembly101/distillation/ego_dino'
  EXO_DINO_BY_FEATS: '/home/wchi/Datasets/Assembly101/distillation/exo_dino'
  MERGED_MODEL: '/home/wchi/Projects/TimeSformer/models/merged_checkpoints/EEF_gen1/TOP_6_model_level_lr01'
  FEATS_DIR: 'features'

  PROXY_CANDIDATE_ROOT: "models/Assembly101_pi_ego"
  PROXY_CANDIDATES: ['exo_rgb', 'exo_skl', 'exo_siglip', 'ego_siglip', 'exo_skego', 'ego_depth', 'exo_depth', 'exo_dino', 'ego_dino']
  PROXY_LOGITS_DIR: "tokens_training/scores_pred"
  PROXY_FEATS_DIR: "tokens_training/tokens"

  NUM_FRAMES: 8
  SAMPLING_RATE: 32
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  INPUT_CHANNEL_NUM: [3]

TIMESFORMER:
  ATTENTION_TYPE: 'divided_space_time'
SOLVER:
  BASE_LR: 0.005
  LR_POLICY: steps_with_relative_lrs
  STEPS: [0, 11, 14]
  LRS: [1, 0.1, 0.01]
  MAX_EPOCH: 15
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  OPTIMIZING_METHOD: sgd
MODEL:
  MODEL_NAME: pi_proxy_vit
  NUM_CLASSES: 24
  ARCH: vit
  LOSS_FUNC: cross_entropy
  DROPOUT_RATE: 0.5
TEST:
  ENABLE: True
  DATASET: Assembly101
  BATCH_SIZE: 8
  NUM_ENSEMBLE_VIEWS: 1
  NUM_SPATIAL_CROPS: 3
  SAVE_RESULTS_PATH: 'scores_pred'
DATA_LOADER:
  NUM_WORKERS: 8
  PIN_MEMORY: True
NUM_GPUS: 4
NUM_SHARDS: 1
RNG_SEED: 0

OUTPUT_DIR: ./models/Assembly101_pi_ego/mm_dist

TOKEN_SAVE_DIR: tokens
SAVE_TOKENS: True

TRAINING_MODE: 'dist' # [basic, dist]

#EXO_MODALITY: ['exo_rgb']
EXO_MODALITY: ['exo_rgb', 'exo_skl', 'exo_siglip', 'ego_siglip', 'exo_skego', 'ego_depth', 'exo_depth', 'ego_dino', 'exo_dino']
#EXO_MODALITY: ['exo_skl']
#EXO_MODALITY: ['exo_skego']
#EXO_MODALITY: ['exo_siglip']
#EXO_MODALITY: ['ego_siglip']
#EXO_MODALITY: ['exo_depth']
#EXO_MODALITY: ['ego_depth']
#EXO_MODALITY: ['exo_dino']
#EXO_MODALITY: ['ego_dino']

GENERATION: 'proxy' # "proxy" or "proxy_gen2"
LOSS_TYPE: 'cosine'
#LOSS_TYPE: 'mse'

LOSS_WEIGHT: 5.0
LOSS_WEIGHT_FEATS: 5.0
LOSS_WEIGHT_LOGITS: 10.0
DIST_THRESHOLD: 4.0
TOP_K: 9
GROUP_TOPK_BY_VIEW: False


#----------Check List-------------
# 1) DATA.PATH_TO_DATA_DIR
# 2) DATA.PATH_PREFIX
# 3) SKL_MODEL_BY_FEATS / RGB_MODEL_BY_FEATS
# 4) PROXY_CANDIDATE_ROOT
# 5) OUTPUT_DIR
# 6) TRAINING_MODE / EXO_MODALITY / GENERATION
