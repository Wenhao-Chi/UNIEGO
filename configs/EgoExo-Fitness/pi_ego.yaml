GENERATION: 'proxy' # 'gen1' or 'gen2' or "proxy" or "proxy_gen2"
LOSS_TYPE: 'cosine'
#LOSS_TYPE: 'mse'

LOSS_WEIGHT: 5.0
LOSS_WEIGHT_FEATS: 5.0
LOSS_WEIGHT_LOGITS: 10.0
