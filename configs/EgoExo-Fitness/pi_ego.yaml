  EXO_SIGLIP_BY_FEATS: '/home/wchi/Datasets/EgoExo-Fitness/distillation/exo_siglip'
  EGO_SIGLIP_BY_FEATS: '/home/wchi/Datasets/EgoExo-Fitness/distillation/ego_siglip'
  EXO_SKEGO_BY_FEATS: '/home/wchi/Datasets/EgoExo-Fitness/distillation/exo_skego'
  EGO_DEPTH_BY_FEATS: '/home/wchi/Datasets/EgoExo-Fitness/distillation/ego_depth'
