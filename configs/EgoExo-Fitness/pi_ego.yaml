#EXO_MODALITY: ['feats']
EXO_MODALITY: ['exo_rgb', 'exo_skl', 'exo_siglip', 'ego_siglip', 'exo_skego', 'ego_depth', 'exo_depth', 'exo_dino', 'ego_dino']
#EXO_MODALITY: ['exo_rgb']
