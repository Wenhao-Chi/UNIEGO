  FEATS_DIR: 'features'

  PROXY_CANDIDATE_ROOT: "models/EgoExo_Fitness_pi_ego"
#  PROXY_CANDIDATES: ['exo_rgb', 'ego_dino']
  PROXY_CANDIDATES: ['exo_rgb', 'exo_skl', 'exo_siglip', 'ego_siglip', 'exo_skego', 'ego_depth', 'exo_depth', 'exo_dino', 'ego_dino']
  PROXY_LOGITS_DIR: "tokens_training/scores_pred"
  PROXY_FEATS_DIR: "tokens_training/tokens"

  NUM_FRAMES: 8
  SAMPLING_RATE: 32
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  INPUT_CHANNEL_NUM: [3]
TIMESFORMER:
  ATTENTION_TYPE: 'divided_space_time'
#  PRETRAINED_MODEL: models/EgoExo_Fitness_pi_ego/merged_models/Global_4_model/merged_top_4.pyth
SOLVER:
  BASE_LR: 0.005
  LR_POLICY: steps_with_relative_lrs
  STEPS: [0, 11, 14]
  LRS: [1, 0.1, 0.01]
  MAX_EPOCH: 15
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  OPTIMIZING_METHOD: sgd
MODEL:
#  MODEL_NAME: vit_base_patch16_224
  MODEL_NAME: pi_proxy_vit
  NUM_CLASSES: 12
  ARCH: vit
  LOSS_FUNC: cross_entropy
  DROPOUT_RATE: 0.5
TEST:
  ENABLE: True
  DATASET: EgoExo_Fitness
  BATCH_SIZE: 8
  NUM_ENSEMBLE_VIEWS: 1
  NUM_SPATIAL_CROPS: 3
  SAVE_RESULTS_PATH: 'scores_pred'
DATA_LOADER:
  NUM_WORKERS: 8
  PIN_MEMORY: True
NUM_GPUS: 4
NUM_SHARDS: 1
RNG_SEED: 0

