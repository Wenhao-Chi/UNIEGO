TRAIN:
  ENABLE: True
#  DATASET: Egoexo4d_proxy
  DATASET: Egoexo4d_proxy_gen2
  BATCH_SIZE: 8
  EVAL_PERIOD: 5
  CHECKPOINT_PERIOD: 5
  AUTO_RESUME: True
DATA:
  PATH_TO_DATA_DIR: '/home/wchi/Datasets/EgoExo4D/annotations/csvs/keystep_segments/ego/'
#  PATH_TO_DATA_DIR: '/home/wchi/Datasets/EgoExo4D/annotations/csvs/keystep_segments/ego_swap_train_test/'
  PATH_PREFIX: '/home/wchi/Datasets/EgoExo4D/keystep_segments_paired'

  SKL_MODEL_BY_FEATS: '/home/wchi/Datasets/EgoExo4D/distillation/exo_skl'
  RGB_MODEL_BY_FEATS: '/home/wchi/Datasets/EgoExo4D/distillation/exo_rgb'
  EXO_SIGLIP_BY_FEATS: '/home/wchi/Datasets/EgoExo4D/distillation/exo_siglip'
  EGO_SIGLIP_BY_FEATS: '/home/wchi/Datasets/EgoExo4D/distillation/ego_siglip'
  EXO_SKEGO_BY_FEATS: '/home/wchi/Datasets/EgoExo4D/distillation/exo_skego'
  EGO_DEPTH_BY_FEATS: '/home/wchi/Datasets/EgoExo4D/distillation/ego_depth'
  EXO_DEPTH_BY_FEATS: '/home/wchi/Datasets/EgoExo4D/distillation/exo_depth'
  EGO_DINO_BY_FEATS: '/home/wchi/Datasets/EgoExo4D/distillation/ego_dino'
  EXO_DINO_BY_FEATS: '/home/wchi/Datasets/EgoExo4D/distillation/exo_dino'
#  MERGED_MODEL: '/home/wchi/Projects/TimeSformer/models/merged_checkpoints/EEF_gen1/TOP_6_model_level_lr01'
  FEATS_DIR: 'features'

  PROXY_CANDIDATE_ROOT: "models/EgoExo_4D_pi_ego"
#  PROXY_CANDIDATES: ['exo_rgb', 'exo_skl']
  PROXY_CANDIDATES: [ 'exo_rgb', 'exo_skl', 'exo_siglip', 'ego_siglip', 'exo_skego', 'ego_depth', 'exo_depth', 'exo_dino', 'ego_dino' ]
  PROXY_LOGITS_DIR: "tokens_training/scores_pred"
  PROXY_FEATS_DIR: "tokens_training/tokens"

  NUM_FRAMES: 8
  SAMPLING_RATE: 32
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  INPUT_CHANNEL_NUM: [3]
TIMESFORMER:
  ATTENTION_TYPE: 'divided_space_time'
#  PRETRAINED_MODEL: /home/wchi/Projects/TimeSformer/models/EgoExo_4D_pi_ego/merged_models/merge_4_model_decay/merged_model.pyth
#  PRETRAINED_MODEL: /home/wchi/Projects/TimeSformer/models/EgoExo_4D_pi_ego/merged_models/merge_9_model_decay/merged_model.pyth
SOLVER:
  BASE_LR: 0.005
  LR_POLICY: steps_with_relative_lrs
  STEPS: [0, 11, 14]
  LRS: [1, 0.1, 0.01]
  MAX_EPOCH: 15
  MOMENTUM: 0.9
  WEIGHT_DECAY: 1e-4
  OPTIMIZING_METHOD: sgd
MODEL:
  MODEL_NAME: pi_proxy_vit
  NUM_CLASSES: 665
  ARCH: vit
  LOSS_FUNC: cross_entropy
  DROPOUT_RATE: 0.5
TEST:
  ENABLE: True
  DATASET: Egoexo4d
  BATCH_SIZE: 8
  NUM_ENSEMBLE_VIEWS: 10 # 1 as default
  NUM_SPATIAL_CROPS: 3 # 3 as default
  SAVE_RESULTS_PATH: 'scores_pred'
DATA_LOADER:
  NUM_WORKERS: 8
  PIN_MEMORY: True
NUM_GPUS: 4
NUM_SHARDS: 1
RNG_SEED: 0

#OUTPUT_DIR: ./models/EgoExo_4D_pi_ego/exo_dino
#OUTPUT_DIR: ./models/EgoExo_4D_pi_ego_gen2/top1_model_FL_cos_w5_all_init_scratch

TOKEN_SAVE_DIR: tokens
SAVE_TOKENS: True

#TRAINING_MODE: 'basic'
TRAINING_MODE: 'dist'

#EXO_MODALITY: ['feats']
EXO_MODALITY: ['feats', 'logits']
#EXO_MODALITY: ['exo_rgb']
#EXO_MODALITY: ['exo_skl']
#EXO_MODALITY: ['exo_skego']
#EXO_MODALITY: ['exo_siglip']
#EXO_MODALITY: ['ego_siglip']
#EXO_MODALITY: ['exo_depth']
#EXO_MODALITY: ['ego_depth']
#EXO_MODALITY: ['exo_dino']
#EXO_MODALITY: ['ego_dino']

GENERATION: 'proxy_gen2' # 'gen1' or 'gen2' or "proxy" or "proxy_gen2"
LOSS_TYPE: 'cosine'
#LOSS_TYPE: 'mse'

LOSS_WEIGHT: 5.0
LOSS_WEIGHT_FEATS: 5.0
LOSS_WEIGHT_LOGITS: 5.0
DIST_THRESHOLD: 4.0
TOP_K: 9
GROUP_TOPK_BY_VIEW: False


